name: Setup toolchain and install dependencies
description: >-
  Shared bootstrap for every job: pnpm via pnpm/action-setup, Node.js from
  .nvmrc with the pnpm store cache, then a frozen-lockfile install. Callers
  MUST run actions/checkout before this action — a local composite action can
  only be resolved from an already-checked-out repository.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9  # v6.0.8
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
      shell: bash
