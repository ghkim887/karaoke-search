name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify all sidecars are in sync
        # The JSON sidecars below are auto-generated from their TS sources during
        # `pnpm build` (above). After the build, each sidecar must be
        # byte-identical to its committed version. If it isn't, a maintainer
        # edited the TS source without re-running the build / forgot to commit
        # the regenerated sidecar — fail loudly so silent drift never reaches
        # a deploy. (Mirrors the same gate in crawl.yml, which only runs weekly;
        # this copy gates every PR.)
        #
        # Sidecars covered:
        #   korean-artist-drop-list.json  — from koreanArtistDropList.ts
        #   clustering-rules.json         — from clustering.ts SPLIT_RE_SOURCE/FLAGS
        run: |
          for sidecar in \
            packages/crawler/src/adapters/tj-media-direct/korean-artist-drop-list.json \
            packages/crawler/src/clustering-rules.json; do
            git diff --exit-code -- "$sidecar" || { echo "Sidecar drift detected: $sidecar"; exit 1; }
          done
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
      - name: Run Python script tests
        # All scripts/test_*.py unittest suites (splitter parity, anisong PDF
        # ingest, title_ko Stage 1, lib helpers). Previously these only ran
        # weekly in crawl.yml — and only the splitter-parity suite at that.
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Verify D1 SQL export metrics
        run: pnpm --filter @karaoke/worker d1:verify-sql
      - name: Worker deploy dry-run
        run: pnpm --filter @karaoke/worker deploy:dry-run

  e2e:
    # Playwright smoke suite on every PR. Without this, a UI-breaking PR merges
    # green and is only caught post-merge by deploy.yml's required e2e gate —
    # which then blocks ALL Pages deploys. Runs in parallel with `verify` (no
    # `needs:` — independent jobs, no shared outputs) and builds in FALLBACK
    # mode (no PUBLIC_KARAOKE_API_BASE_URL) so PR CI exercises the offline
    # MiniSearch path and never depends on a live Worker. Mirrors deploy.yml's
    # e2e job step-for-step. PR-only: on a main push deploy.yml runs the
    # identical fallback e2e as the required deploy gate, so running it here
    # too would duplicate the same suite on the same commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - name: Build web app in fallback mode (no API base URL)
        # `--filter @karaoke/web...` selects the web app plus its workspace
        # dependencies (@karaoke/schema must emit dist/ before the web build).
        run: pnpm --filter @karaoke/web... build
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm --filter @karaoke/web exec playwright install --with-deps chromium
      - name: Start preview server and wait until ready
        run: |
          nohup pnpm --filter @karaoke/web exec astro preview --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          disown
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if curl -fsS http://127.0.0.1:4321/karaoke-search/ > /dev/null; then
              echo "preview ready after $((SECONDS))s"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not start within 30s. Server log:"
          cat /tmp/preview.log
          exit 1
      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4321/karaoke-search/
        run: pnpm --filter @karaoke/web test:e2e
