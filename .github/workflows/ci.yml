name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dead-code / unused-dependency scan (knip)
        # Required gate: knip's exit code fails the build on any unused file,
        # export or dependency across the workspace (report is now clean).
        # continue-on-error was dropped once the report was reviewed and trusted
        # (T5-A); the step already preserves knip's exit code via PIPESTATUS +
        # `exit "$knip_exit"`, so removing continue-on-error alone promotes it.
        # The full report is still copied to the job summary so findings are
        # visible without opening raw logs. knip's built-in vitest / playwright /
        # astro / typescript plugins already recognise the per-package
        # vitest.config.ts, playwright.config.ts, astro.config.mjs and
        # tsconfig.typecheck.json files, so knip.json needs no bespoke entry
        # globs for them. apps/web/functions/**/*.js are declared as knip entry
        # points in knip.json — they are the Cloudflare Pages Functions live
        # production entry (karaokedb.pages.dev /api + /healthz) and so are
        # unreachable from the import graph, which would otherwise flag them as
        # unused files.
        run: |
          report="$RUNNER_TEMP/knip-report.txt"
          set +e
          pnpm exec knip --no-progress 2>&1 | tee "$report"
          knip_exit=${PIPESTATUS[0]}
          set -e
          {
            echo "### knip report"
            echo ""
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$knip_exit"
      - name: Verify all sidecars are in sync
        # The JSON sidecars below are auto-generated from their TS sources during
        # `pnpm build` (above). After the build, each sidecar must be
        # byte-identical to its committed version. If it isn't, a maintainer
        # edited the TS source without re-running the build / forgot to commit
        # the regenerated sidecar — fail loudly so silent drift never reaches
        # a deploy. (Mirrors the same gate in crawl.yml, which only runs weekly;
        # this copy gates every PR.)
        #
        # Sidecars covered:
        #   korean-artist-drop-list.json  — from koreanArtistDropList.ts
        #   clustering-rules.json         — from clustering.ts SPLIT_RE_SOURCE/FLAGS
        run: |
          for sidecar in \
            packages/crawler/src/adapters/tj-media-direct/korean-artist-drop-list.json \
            packages/crawler/src/clustering-rules.json; do
            git diff --exit-code -- "$sidecar" || { echo "Sidecar drift detected: $sidecar"; exit 1; }
          done
      - name: Verify full-corpus manifest shape
        # Cheap per-PR trust gate for data/full-corpus.manifest.json — shape
        # validation only, via the same scripts/lib/manifest.mjs validator the
        # publisher/fetcher use. Never downloads the ~85 MB corpus asset; the
        # full sha256 recompute against the real asset happens once, in
        # full-corpus.yml at publish time. No-ops gracefully until the first
        # manifest lands on main (today the file does not exist yet).
        run: |
          if [ -f data/full-corpus.manifest.json ]; then
            node scripts/verify-manifest.mjs
          else
            echo "data/full-corpus.manifest.json not present yet — skipping"
          fi
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
      - name: Run Python script tests
        # All scripts/test_*.py unittest suites (splitter parity, anisong PDF
        # ingest, title_ko Stage 1, lib helpers). Previously these only ran
        # weekly in crawl.yml — and only the splitter-parity suite at that.
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Build self-host SQLite DB from the committed corpus
        # Corpus gate: `sqlite:build` imports the committed songs.json through
        # @karaoke/data-store's importSongsJson, which runs validateSongCorpus
        # (per-record schema validation + duplicate-id detection) over every
        # committed record AND proves the self-host search database builds
        # end-to-end on every PR. Replaced the Cloudflare D1 SQL-export gate
        # when the CF deploy path was removed (2026-06-13).
        run: pnpm --filter @karaoke/worker sqlite:build

  e2e:
    # Playwright smoke + axe-core a11y suite. Builds the web app in FALLBACK
    # mode (no PUBLIC_KARAOKE_API_BASE_URL) so CI exercises the offline
    # MiniSearch path and never depends on a live search API, serves the build
    # over `astro preview`, and runs the Playwright specs against it with
    # E2E_BASE_URL set (the specs self-skip when it is unset, so the injected
    # base URL is what makes both the search smoke and the axe a11y gate
    # actually execute). Runs in parallel with `verify` (no `needs:` —
    # independent jobs, no shared outputs).
    #
    # This is the ONLY e2e gate. The Cloudflare deploy path and its deploy.yml —
    # which previously ran an identical fallback e2e as the required deploy gate,
    # so this job used to be scoped to pull_request only to avoid duplicating it
    # on a main push — were removed on 2026-06-13. With no deploy.yml, the job
    # must run on pushes to main as well, otherwise the merge/squash commit that
    # actually lands on main would ship with no e2e coverage at all.
    # ci-pipeline-pins.test.ts pins the continued absence of deploy.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - name: Build web app in fallback mode (no API base URL)
        # `--filter @karaoke/web...` selects the web app plus its workspace
        # dependencies (@karaoke/schema must emit dist/ before the web build).
        run: pnpm --filter @karaoke/web... build
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm --filter @karaoke/web exec playwright install --with-deps chromium
      - name: Start preview server and wait until ready
        run: |
          nohup pnpm --filter @karaoke/web exec astro preview --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          disown
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then
              echo "preview ready after $((SECONDS))s"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not start within 30s. Server log:"
          cat /tmp/preview.log
          exit 1
      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4321/
        run: pnpm --filter @karaoke/web test:e2e
