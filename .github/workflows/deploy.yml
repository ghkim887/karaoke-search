name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9  # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @karaoke/web build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: apps/web/dist
      - name: Upload dist for e2e
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  e2e:
    # Re-uses the `dist/` artifact from the `build` job — exercises the exact
    # bytes that `deploy-pages` ships, skipping the slow rebuild step.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9  # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        # Still required: Playwright CLI runs from node_modules. The savings
        # come from skipping `pnpm -r build` (the slow step).
        run: pnpm install --frozen-lockfile
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm --filter @karaoke/web exec playwright install --with-deps chromium
      - name: Start preview server and wait until ready
        run: |
          nohup pnpm --filter @karaoke/web exec astro preview --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          disown
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if curl -fsS http://127.0.0.1:4321/karaoke-search/ > /dev/null; then
              echo "preview ready after $((SECONDS))s"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not start within 30s. Server log:"
          cat /tmp/preview.log
          exit 1
      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4321/karaoke-search/
        run: pnpm --filter @karaoke/web test:e2e

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
