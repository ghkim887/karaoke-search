name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Builds the deployed Pages artifact in API-first mode. The self-hosted
    # Node + SQLite API is exposed through Tailscale Funnel; the bundled
    # MiniSearch index remains only for local/offline fallback builds.
    runs-on: ubuntu-latest
    env:
      PUBLIC_KARAOKE_API_BASE_URL: https://hermes-host.tail04d970.ts.net
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm -r build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: apps/web/dist

  e2e:
    # Builds its OWN dist in fallback mode (no PUBLIC_KARAOKE_API_BASE_URL)
    # and runs Playwright against it. e2e is a required deploy gate
    # (`deploy` needs: [build, e2e]) and exercises the offline MiniSearch
    # path — the only mode while no search API is configured. An in-job
    # scoped build is the simplest mechanism: the composite setup already
    # installs all deps, and the build job's Pages artifact stays untouched
    # (and keeps working if the build job ever sets an API base URL again).
    # No `needs: build` — the two jobs are independent and run in parallel.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Setup toolchain and install dependencies
        uses: ./.github/actions/setup
      - name: Build web app in fallback mode (no API base URL)
        # `--filter @karaoke/web...` selects the web app plus its workspace
        # dependencies (@karaoke/schema must emit dist/ before the web build).
        run: pnpm --filter @karaoke/web... build
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm --filter @karaoke/web exec playwright install --with-deps chromium
      - name: Start preview server and wait until ready
        run: |
          nohup pnpm --filter @karaoke/web exec astro preview --host 127.0.0.1 --port 4321 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          disown
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if curl -fsS http://127.0.0.1:4321/karaoke-search/ > /dev/null; then
              echo "preview ready after $((SECONDS))s"
              exit 0
            fi
            sleep 1
          done
          echo "preview did not start within 30s. Server log:"
          cat /tmp/preview.log
          exit 1
      - name: Run E2E tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4321/karaoke-search/
        run: pnpm --filter @karaoke/web test:e2e

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
