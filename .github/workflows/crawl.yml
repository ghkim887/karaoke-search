name: crawl

on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max artists to crawl (0 = no limit)'
        required: false
        type: number
        default: 0

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup toolchain and install dependencies
        uses: ./.github/actions/setup

      - name: Restore HTTP cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .cache/http.json
          key: "crawl-http-${{ github.run_id }}"
          restore-keys: |
            crawl-http-

      - name: Build packages
        run: pnpm -r build

      - name: Verify all sidecars are in sync
        # The JSON sidecars below are auto-generated from their TS sources during
        # `pnpm -r build` (above). After the build, each sidecar must be
        # byte-identical to its committed version. If it isn't, a maintainer
        # edited the TS source without re-running the build / forgot to commit
        # the regenerated sidecar — fail loudly so silent drift never reaches
        # a deploy.
        #
        # Sidecars covered:
        #   korean-artist-drop-list.json  — from koreanArtistDropList.ts
        #   clustering-rules.json         — from clustering.ts SPLIT_RE_SOURCE/FLAGS
        run: |
          for sidecar in \
            packages/crawler/src/curated/korean-artist-drop-list.json \
            packages/crawler/src/clustering-rules.json; do
            git diff --exit-code -- "$sidecar" || { echo "Sidecar drift detected: $sidecar"; exit 1; }
          done

      - name: Run crawler
        # Fix E.2 (2026-05-01): pass `inputs.limit` via env-var rather than
        # direct `${{ ... }}` interpolation into the run-script. Defense-in-
        # depth against shell injection — if a user-provided value ever
        # contained shell metacharacters, the env-var path would still treat
        # it as a single argument, while raw interpolation would expand it
        # into the shell's parser.
        env:
          LIMIT: ${{ inputs.limit || 0 }}
        run: pnpm --filter @karaoke/crawler start --limit "$LIMIT" --out apps/web/public/data/songs.json.tmp --conflicts-out /tmp/merge-conflicts.json

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Run post-crawl pipeline
        # The 11-step order-load-bearing post-processing chain (atomic rename
        # → splitter parity → tjpdf catalog ingest → Stage 1 title_ko strip →
        # merger replay → KPOP drop → Cpop drop → Stage 2 LLM cache replay
        # (continue-on-error inside the runner) → manual title_ko fixes →
        # cache prune → schema validation) lives in the runner's step table —
        # the single source of truth for the order. Per-step status is in the
        # runner's summary output.
        run: node scripts/run-post-crawl-pipeline.mjs

      - name: Run crawler tests before opening the crawl PR
        # Runs the @karaoke/crawler package test suite against the corpus the
        # post-crawl pipeline just wrote (apps/web/public/data/songs.json) BEFORE
        # any PR is proposed. The load-bearing guard is
        # packages/crawler/test/product-corpus-regression.test.ts, which asserts
        # the known TJ-direct Korean-script leakage rows never return -- an
        # absence check, so it stays green as the corpus legitimately grows.
        #
        # Deliberately scoped to the crawler package, NOT the full workspace
        # suite (`pnpm test`): the workspace suite includes corpus-identity
        # golden tests (apps/web search-parity baseline) that sha256-pin the
        # committed songs.json and fail on ANY corpus change -- i.e. on every
        # legitimate weekly crawl -- which would false-red this gate and block
        # every crawl PR from opening. The crawler package holds no such pin.
        #
        # Why this runs here and not only in ci.yml: the crawl PR is opened by
        # peter-evans/create-pull-request using the default GITHUB_TOKEN, and
        # GitHub does not trigger `on: pull_request` workflows for PRs created
        # with GITHUB_TOKEN. So ci.yml (lint/typecheck/test/build) never runs on
        # crawl-output PRs -- a corpus regression stays invisible until the
        # post-merge push to main goes red (PR #95 shipped 145 Korean-script
        # leakage rows; CI only failed after the squash-merge landed on main).
        # This step closes that gap by running the guard inside the crawl job.
        #
        # Failure mode (intended): if the suite fails, this step fails, the crawl
        # run goes red, and NO PR is opened -- the regressing corpus is never
        # proposed. Accepted tradeoff: a regression blocks the weekly data PR
        # until it is fixed (owner remediation decision, 2026-07-09).
        run: pnpm --filter @karaoke/crawler test

      - name: Snapshot the committed search-parity baseline
        # Copy the CURRENTLY COMMITTED parity baseline aside before regenerating
        # it below, so the delta step can diff pre-crawl vs regenerated. Lands in
        # RUNNER_TEMP (outside the repo tree) so it is never staged into the PR.
        run: cp apps/web/src/lib/__snapshots__/search-parity.baseline.json "${RUNNER_TEMP}/parity-baseline.old.json"

      - name: Regenerate the search-parity baseline from the crawled corpus
        # POLICY (owner-approved 2026-07-10): the weekly crawl rewrites the corpus
        # by design, which changes its sha256. The search-parity golden gate
        # (apps/web/src/lib/search-parity.golden.test.ts) sha256-pins the committed
        # corpus, so on a crawl PR it CANNOT pass until its baseline is regenerated
        # against the new corpus. Historically a human regenerated it by hand after
        # the crawl, so every crawl PR shipped with apps/web tests red -- this bit
        # us in #95 (masked by pnpm's bail). We regenerate inside the workflow AND
        # surface the resulting per-query delta in the PR body (next two steps), so
        # the human drift-gate MOVES to the crawl-PR review instead of being
        # silently rubber-stamped: auto-regen alone would hide real ranking drift;
        # the delta report is what preserves the gate's purpose.
        #
        # ORDER IS LOAD-BEARING: this runs AFTER the crawler-test leakage gate
        # above. We must never regenerate a baseline for a corpus that fails the
        # leakage guard -- a red leakage gate stops the run before we reach here.
        #
        # UPDATE-MODE SEMANTICS (intended): with UPDATE_PARITY_SNAPSHOT=1 the test
        # rewrites the baseline from the freshly built indexes, so the corpus-
        # identity / per-query / aggregate assertions compare the new baseline
        # against itself and pass trivially. BUT the relevance-smoke assertions
        # (obvious matches must rank top-3 on BOTH search paths, resolved by stable
        # karaoke number) and the setup-time stable-key resolution STILL run and
        # STILL assert under UPDATE mode -- so if the new corpus drops an obvious
        # match out of the top 3, or a smoke case's stable key goes stale/ambiguous,
        # vitest exits non-zero, THIS step fails, the crawl run goes red, and NO PR
        # is opened. That is the intended safety net: a corpus that breaks an
        # obvious-match smoke is never proposed.
        env:
          UPDATE_PARITY_SNAPSHOT: '1'
        run: pnpm --filter @karaoke/web exec vitest run src/lib/search-parity.golden.test.ts

      - name: Compute the search-parity baseline delta for the PR body
        # Diff the pre-crawl baseline (snapshotted above) against the just-
        # regenerated one and render a markdown section for the PR body.
        # compare-parity-baselines.mjs NEVER fails the build on a regression -- the
        # crawl PR must still open so a human can review the delta -- but it flags
        # any dropped Jaccard or lost top-1 agreement loudly so the reviewer must
        # acknowledge it before merge.
        run: node scripts/compare-parity-baselines.mjs "${RUNNER_TEMP}/parity-baseline.old.json" apps/web/src/lib/__snapshots__/search-parity.baseline.json > "${RUNNER_TEMP}/parity-delta.md"

      - name: Audit the crawled corpus for simplified-Chinese leaks (report-only)
        # REPORT-ONLY companion to the parity delta above: scan the freshly
        # crawled corpus (the songs.json the post-crawl pipeline just wrote) for
        # rows whose title/artist carries a simplified-Chinese-only Han character
        # -- a high-precision Mandopop/Cantopop-leak signal (calibrated to 0 hits
        # on BOTH the 26k baseline and the 313k v22 corpus, so ANY hit is worth a
        # human glance). Writes suspects JSONL under RUNNER_TEMP (outside the repo
        # tree, never staged into the PR); the compose step below renders it.
        #
        # This NEVER reds the crawl. Unlike the Korean-script leakage GATE in the
        # crawler test suite (which is meant to stop the run), this is purely
        # informational. The `|| true` guarantees the run continues even if the
        # audit exits non-zero for an operational reason -- its ONLY non-zero exit
        # is 2 on a missing corpus, in which case no suspects file is written and
        # the compose step renders a visible "could not read" note in the PR body
        # rather than silently dropping the section. (continue-on-error is not
        # used: `|| true` makes the intent explicit at the point of failure and
        # keeps the step green so the audit's stdout summary stays easy to find.)
        run: node scripts/audit-simplified-chinese.mjs apps/web/public/data/songs.json --out "${RUNNER_TEMP}/chinese-audit" || true

      - name: Compose PR body with merge-conflict summary, parity delta, and Chinese-leak audit
        run: node scripts/compose-crawl-pr-body.mjs /tmp/merge-conflicts.json "${RUNNER_TEMP}/parity-delta.md" "${RUNNER_TEMP}/chinese-audit/suspects.jsonl" > "${RUNNER_TEMP}/pr_body.md"

      - name: Close prior crawl PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --label crawl-output --state open --json number -q '.[].number' | xargs -r -n1 gh pr close

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: "crawl/${{ github.run_id }}"
          commit-message: "data: weekly crawl ${{ github.run_id }}"
          title: "data: weekly crawl ${{ github.run_id }}"
          body-path: ${{ runner.temp }}/pr_body.md
          labels: crawl-output
          add-paths: |
            apps/web/public/data/songs.json
            apps/web/public/data/tj-search-cache.json
            apps/web/src/lib/__snapshots__/search-parity.baseline.json
