name: crawl

on:
  schedule:
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max artists to crawl (0 = no limit)'
        required: false
        type: number
        default: 0

concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup toolchain and install dependencies
        uses: ./.github/actions/setup

      - name: Restore HTTP cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .cache/http.json
          key: "crawl-http-${{ github.run_id }}"
          restore-keys: |
            crawl-http-

      - name: Build packages
        run: pnpm -r build

      - name: Verify all sidecars are in sync
        # The JSON sidecars below are auto-generated from their TS sources during
        # `pnpm -r build` (above). After the build, each sidecar must be
        # byte-identical to its committed version. If it isn't, a maintainer
        # edited the TS source without re-running the build / forgot to commit
        # the regenerated sidecar — fail loudly so silent drift never reaches
        # a deploy.
        #
        # Sidecars covered:
        #   korean-artist-drop-list.json  — from koreanArtistDropList.ts
        #   clustering-rules.json         — from clustering.ts SPLIT_RE_SOURCE/FLAGS
        run: |
          for sidecar in \
            packages/crawler/src/adapters/tj-media-direct/korean-artist-drop-list.json \
            packages/crawler/src/clustering-rules.json; do
            git diff --exit-code -- "$sidecar" || { echo "Sidecar drift detected: $sidecar"; exit 1; }
          done

      - name: Run crawler
        # Fix E.2 (2026-05-01): pass `inputs.limit` via env-var rather than
        # direct `${{ ... }}` interpolation into the run-script. Defense-in-
        # depth against shell injection — if a user-provided value ever
        # contained shell metacharacters, the env-var path would still treat
        # it as a single argument, while raw interpolation would expand it
        # into the shell's parser.
        env:
          LIMIT: ${{ inputs.limit || 0 }}
        run: pnpm --filter @karaoke/crawler start --limit "$LIMIT" --out apps/web/public/data/songs.json.tmp --conflicts-out /tmp/merge-conflicts.json

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Run post-crawl pipeline
        # The 11-step order-load-bearing post-processing chain (atomic rename
        # → splitter parity → anisong PDF ingest → Stage 1 title_ko strip →
        # merger replay → KPOP drop → Cpop drop → Stage 2 LLM cache replay
        # (continue-on-error inside the runner) → manual title_ko fixes →
        # cache prune → schema validation) lives in the runner's step table —
        # the single source of truth for the order. Per-step status is in the
        # runner's summary output.
        run: node scripts/run-post-crawl-pipeline.mjs

      - name: Run crawler tests before opening the crawl PR
        # Runs the @karaoke/crawler package test suite against the corpus the
        # post-crawl pipeline just wrote (apps/web/public/data/songs.json) BEFORE
        # any PR is proposed. The load-bearing guard is
        # packages/crawler/test/product-corpus-regression.test.ts, which asserts
        # the known TJ-direct Korean-script leakage rows never return -- an
        # absence check, so it stays green as the corpus legitimately grows.
        #
        # Deliberately scoped to the crawler package, NOT the full workspace
        # suite (`pnpm test`): the workspace suite includes corpus-identity
        # golden tests (apps/web search-parity baseline) that sha256-pin the
        # committed songs.json and fail on ANY corpus change -- i.e. on every
        # legitimate weekly crawl -- which would false-red this gate and block
        # every crawl PR from opening. The crawler package holds no such pin.
        #
        # Why this runs here and not only in ci.yml: the crawl PR is opened by
        # peter-evans/create-pull-request using the default GITHUB_TOKEN, and
        # GitHub does not trigger `on: pull_request` workflows for PRs created
        # with GITHUB_TOKEN. So ci.yml (lint/typecheck/test/build) never runs on
        # crawl-output PRs -- a corpus regression stays invisible until the
        # post-merge push to main goes red (PR #95 shipped 145 Korean-script
        # leakage rows; CI only failed after the squash-merge landed on main).
        # This step closes that gap by running the guard inside the crawl job.
        #
        # Failure mode (intended): if the suite fails, this step fails, the crawl
        # run goes red, and NO PR is opened -- the regressing corpus is never
        # proposed. Accepted tradeoff: a regression blocks the weekly data PR
        # until it is fixed (owner remediation decision, 2026-07-09).
        run: pnpm --filter @karaoke/crawler test

      - name: Compose PR body with merge-conflict summary
        run: node scripts/compose-crawl-pr-body.mjs /tmp/merge-conflicts.json > "${RUNNER_TEMP}/pr_body.md"

      - name: Close prior crawl PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --label crawl-output --state open --json number -q '.[].number' | xargs -r -n1 gh pr close

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: "crawl/${{ github.run_id }}"
          commit-message: "data: weekly crawl ${{ github.run_id }}"
          title: "data: weekly crawl ${{ github.run_id }}"
          body-path: ${{ runner.temp }}/pr_body.md
          labels: crawl-output
          add-paths: |
            apps/web/public/data/songs.json
            apps/web/public/data/tj-search-cache.json
